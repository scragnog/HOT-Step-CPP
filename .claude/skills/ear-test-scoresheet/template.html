<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Ear-test score sheet (local file). Written by make-scoresheet.mjs from a study.json;
     re-run the generator rather than editing the STUDY line. See SKILL.md in this folder. -->
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F2F4F1; --surface:#FFFFFF; --sunk:#E7EBE6; --ink:#1A1F1C; --muted:#5E6862; --rule:#D3D9D3;
  --accent:#1F6F8B; --accent-ink:#FFFFFF; --good:#2E8A57; --warn:#B7801A; --bad:#B8402F;
  --good-bg:#E3F2E8; --warn-bg:#F7EDD6; --bad-bg:#F6E1DD;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--ground:#131715;--surface:#1B201D;--sunk:#232925;--ink:#E3E8E4;--muted:#95A09A;--rule:#2F3732;
  --accent:#58A9C6;--accent-ink:#0E1512;--good:#5BC08A;--warn:#E0AE4C;--bad:#E57A68;
  --good-bg:#1D3326;--warn-bg:#352C17;--bad-bg:#3A221E;}}
:root[data-theme="dark"]{
  color-scheme:dark;--ground:#131715;--surface:#1B201D;--sunk:#232925;--ink:#E3E8E4;--muted:#95A09A;--rule:#2F3732;
  --accent:#58A9C6;--accent-ink:#0E1512;--good:#5BC08A;--warn:#E0AE4C;--bad:#E57A68;
  --good-bg:#1D3326;--warn-bg:#352C17;--bad-bg:#3A221E;}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 64px}
header h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.01em;margin:0;text-wrap:balance}
header p{color:var(--muted);margin:6px 0 0;max-width:72ch}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px}
.status.err{color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 14px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:7px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 18px;margin:0 0 18px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.legend div{font-size:12.5px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;margin-bottom:14px}
.pick label{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.02em}
.pick select{font:500 14px var(--mono);padding:6px 8px;border-radius:6px;border:1px solid var(--rule);background:var(--ground);color:var(--ink)}
.pick textarea{flex:1 1 260px;min-height:36px}
.pick .count{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
.folder{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.folder code{background:var(--sunk);padding:4px 8px;border-radius:5px;color:var(--ink);word-break:break-all}
.ghost{border:1px solid var(--rule);background:transparent;color:var(--ink);font:500 12px var(--body);padding:4px 10px;border-radius:6px;cursor:pointer}
.chart{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px 6px;margin-bottom:14px}
.chart h3{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 4px;letter-spacing:.02em}
.chart .keys{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.chart .keys i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chart svg{width:100%;height:auto;display:block}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:170px 1fr;gap:14px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.row.v-good{border-left:4px solid var(--good)} .row.v-borderline{border-left:4px solid var(--warn)} .row.v-over{border-left:4px solid var(--bad)}
.id .rung{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05}
.id .rung small{display:block;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.id .file{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px;word-break:break-all}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.crit .name{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.dots{display:flex;gap:4px}
.dots button{width:30px;height:30px;border-radius:6px;border:1px solid var(--rule);background:var(--ground);color:var(--muted);font:500 13px var(--mono);cursor:pointer;font-variant-numeric:tabular-nums}
.dots button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.foot{grid-column:2;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.verdict{display:flex;gap:6px;flex-wrap:wrap}
.verdict button{border:1px solid var(--rule);background:transparent;color:var(--ink);font:600 12.5px var(--body);padding:6px 11px;border-radius:999px;cursor:pointer}
.verdict button[data-v="good"][aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.verdict button[data-v="borderline"][aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.verdict button[data-v="over"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
textarea{flex:1 1 280px;min-height:34px;resize:vertical;font:13px var(--body);padding:7px 9px;border-radius:6px;border:1px solid var(--rule);background:var(--ground);color:var(--ink)}
.player{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.player audio{width:100%;height:36px}
.player .wait{font:500 12.5px var(--mono);color:var(--muted);padding:8px 0}
.row.pending{opacity:.62}
.savebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.savebar button{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 12.5px var(--body);padding:6px 12px;border-radius:6px;cursor:pointer}
.savebar button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--rule);border-radius:10px}
@media (max-width:720px){.row{grid-template-columns:1fr}.foot{grid-column:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p id="intro"></p>
    <div class="savebar">
      <button id="connect" type="button">Save scores to a file…</button>
      <button id="export" type="button" class="ghost">Export scores</button>
      <span class="status" id="status" role="status" style="margin:0"></span>
    </div>
  </header>

  <div class="bar">
    <div class="seg" id="roundSeg" role="group" aria-label="Round"></div>
    <div class="seg" id="artistSeg" role="group" aria-label="Group"></div>
  </div>

  <div class="legend" id="legend"></div>

  <div id="panel"></div>
</div>
<script>
// The generator replaces the next line with the study: config + tracks.
const STUDY=__STUDY__;
// Track: {id, round, group, order, label, sublabel, x, reference, file, url}
// `url` is relative to this HTML file; `reference` rows (a no-adapter control)
// are listed but kept off the chart and out of the picker.
const CONFIG=STUDY, TRACKS=STUDY.tracks;
const CRIT=CONFIG.criteria.map(c=>[c.key,c.name]);
const LS="scoresheet:"+STUDY.id;
document.getElementById("title").textContent=CONFIG.title;
document.getElementById("intro").textContent=CONFIG.intro;
document.getElementById("legend").replaceChildren(...CONFIG.criteria.map(c=>{const d=document.createElement("div");const b=document.createElement("b");b.textContent=c.name;d.append(b," — "+c.desc);return d;}));

let scores={}, picks={}, round=null, group=null, fileHandle=null;
const available=new Set();
const statusEl=document.getElementById("status");
function say(t,err){statusEl.textContent=t;statusEl.classList.toggle("err",!!err);}
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null)e.setAttribute(k,v);}for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e;}

// ── Persistence: this browser (always) + a scores.json the agent reads. ──────
function snapshot(){return {study:STUDY.id,updatedAt:Date.now(),scores,picks};}
function merge(data){
  for(const[kind,into]of[["scores",scores],["picks",picks]])
    for(const[k,v]of Object.entries(data?.[kind]||{}))if(!into[k]||(v.updatedAt||0)>(into[k].updatedAt||0))into[k]=v;
}
try{merge(JSON.parse(localStorage.getItem(LS)||"{}"));}catch{}
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("scoresheet",1);r.onupgradeneeded=()=>r.result.createObjectStore("handles");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});
async function idbDo(mode,fn){const db=await idb();return new Promise((ok,no)=>{const tx=db.transaction("handles",mode);const q=fn(tx.objectStore("handles"));tx.oncomplete=()=>ok(q?.result);tx.onerror=()=>no(tx.error);});}
let writing=false, again=false, timer=null;
function persist(){
  try{localStorage.setItem(LS,JSON.stringify(snapshot()));}catch{}
  clearTimeout(timer);timer=setTimeout(writeFile,400);
}
async function writeFile(){
  if(!fileHandle)return;
  if(writing){again=true;return;}
  writing=true;
  try{const w=await fileHandle.createWritable();await w.write(JSON.stringify(snapshot(),null,1));await w.close();say("Saved to "+fileHandle.name+" at "+new Date().toLocaleTimeString());}
  catch(e){say("Could not write "+fileHandle.name+": "+e.message+". Scores are still kept in this browser.",true);}
  finally{writing=false;if(again){again=false;writeFile();}}
}
async function useHandle(h,fromClick){
  const perm=await h.queryPermission({mode:"readwrite"});
  if(perm!=="granted"&&!(fromClick&&await h.requestPermission({mode:"readwrite"})==="granted")){
    fileHandle=null;document.getElementById("connect").textContent="Reconnect "+h.name;say("Click Reconnect to keep saving to "+h.name+".");return;
  }
  fileHandle=h;
  try{const f=await h.getFile();const text=await f.text();if(text.trim())merge(JSON.parse(text));}catch{}
  document.getElementById("connect").textContent="Saving to "+h.name;
  await idbDo("readwrite",s=>s.put(h,STUDY.id));
  render();writeFile();
}
document.getElementById("connect").onclick=async()=>{
  try{
    const stored=await idbDo("readonly",s=>s.get(STUDY.id)).catch(()=>null);
    if(stored&&!fileHandle){await useHandle(stored,true);if(fileHandle)return;}
    const h=await window.showSaveFilePicker({suggestedName:"scores.json",types:[{description:"Scores",accept:{"application/json":[".json"]}}]});
    await useHandle(h,true);
  }catch(e){if(e.name!=="AbortError")say("This browser can't save to a file ("+e.message+"). Use Export scores instead.",true);}
};
document.getElementById("export").onclick=()=>{
  const a=el("a",{href:URL.createObjectURL(new Blob([JSON.stringify(snapshot(),null,1)],{type:"application/json"})),download:"scores.json"});
  document.body.append(a);a.click();a.remove();
};
if(!window.showSaveFilePicker){document.getElementById("connect").hidden=true;say("This browser can't save to a file: use Export scores when you finish and put scores.json next to this page.");}
else say("Scores are kept in this browser. Click “Save scores to a file…” and save scores.json next to this page so Claude can read them.");
idbDo("readonly",s=>s.get(STUDY.id)).then(h=>h&&useHandle(h,false)).catch(()=>{});

// ── Audio: renders that have not landed yet are re-checked until they do. ──
const players=new Map();
function player(t){let a=players.get(t.id);if(!a){a=el("audio",{controls:"",preload:"metadata",src:t.url,"aria-label":"Play "+t.file});players.set(t.id,a);}return a;}
document.addEventListener("play",e=>{for(const a of players.values())if(a!==e.target&&!a.paused)a.pause();},true);
function probe(){
  for(const t of TRACKS){
    if(available.has(t.id))continue;
    const a=new Audio();a.preload="metadata";
    a.onloadedmetadata=()=>{available.add(t.id);render();};
    a.src=t.url;
  }
}
probe();setInterval(()=>{if(TRACKS.some(t=>!available.has(t.id)))probe();},10000);

// ── UI ────────────────────────────────────────────────────────────────────
const isRef=t=>!!t.reference;
const avg=(s,keys)=>{const v=keys.map(k=>s?.[k]).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
let noteTimer=null;
function render(){
  const rounds=[...new Set(TRACKS.map(t=>t.round))].sort((a,b)=>a-b);
  if(round===null||!rounds.includes(round))round=rounds[rounds.length-1]??null;
  const groups=[...new Set(TRACKS.filter(t=>t.round===round).map(t=>t.group))];
  if(!groups.includes(group))group=groups[0]??null;
  document.getElementById("roundSeg").replaceChildren(...rounds.map(r=>el("button",{"aria-pressed":String(r===round),onclick:()=>{round=r;render();}},CONFIG.roundNames?.[r]||"Round "+r)));
  document.getElementById("artistSeg").replaceChildren(...groups.map(g=>el("button",{"aria-pressed":String(g===group),onclick:()=>{group=g;render();}},g)));
  const panel=document.getElementById("panel");
  const list=TRACKS.filter(t=>t.round===round&&t.group===group).sort((a,b)=>a.order-b.order);
  if(!list.length){panel.replaceChildren(el("div",{class:"empty"},"No renders in this round yet."));return;}
  const key=`r${round}-${group}`, pick=picks[key]||{};
  const setPick=patch=>{picks[key]={...picks[key],...patch,round,group,updatedAt:Date.now()};persist();};
  const scored=list.filter(t=>CRIT.every(([k])=>Number.isFinite(scores[t.id]?.[k]))).length;
  const sel=el("select",{id:"pick-"+key,onchange:e=>setPick({lastGood:e.target.value})},
    el("option",{value:""},"— not decided —"),...list.filter(t=>!isRef(t)).map(t=>el("option",{value:t.id,...(pick.lastGood===t.id?{selected:""}:{})},t.label)));
  const pnote=el("textarea",{id:"picknote-"+key,placeholder:"Why this rung? What went wrong on the next one?",oninput:e=>{picks[key]={...picks[key],note:e.target.value,round,group,updatedAt:Date.now()};clearTimeout(noteTimer);noteTimer=setTimeout(persist,500);}});
  pnote.value=pick.note||"";
  const focusId=document.activeElement?.id, caret=document.activeElement?.selectionStart;
  panel.replaceChildren(
    el("div",{class:"pick"},el("label",{for:sel.id},CONFIG.pickLabel||"Last good rung"),sel,pnote,el("span",{class:"count"},`${scored}/${list.length} scored`)),
    chart(list),
    el("div",{class:"rows"},...list.map(row)));
  // Put the cursor back if a redraw (a render landing) happened mid-note.
  if(focusId){const n=document.getElementById(focusId);if(n&&n.tagName==="TEXTAREA"){n.focus();if(Number.isFinite(caret))n.setSelectionRange(caret,caret);}}
}
function chart(list){
  const pts=list.filter(t=>!isRef(t));
  const W=720,H=150,L=34,R=12,T=12,B=26;
  const x=i=>L+(pts.length<2?0:i*(W-L-R)/(pts.length-1)), y=v=>T+(5-v)*(H-T-B)/4;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("role","img");svg.setAttribute("aria-label","Score averages by rung");
  const add=(tag,a)=>{const n=document.createElementNS(svg.namespaceURI,tag);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);svg.append(n);return n;};
  for(let v=1;v<=5;v++){add("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:"var(--rule)","stroke-width":1});add("text",{x:L-8,y:y(v)+4,"text-anchor":"end","font-size":11,fill:"var(--muted)","font-family":"IBM Plex Mono, monospace"}).textContent=v;}
  pts.forEach((t,i)=>{add("text",{x:x(i),y:H-8,"text-anchor":"middle","font-size":11,fill:"var(--muted)","font-family":"IBM Plex Mono, monospace"}).textContent=t.x??i+1;});
  for(const[name,def]of Object.entries(CONFIG.series)){
    const keys=CONFIG.criteria.filter(c=>c.series===name).map(c=>c.key);
    const vals=pts.map((t,i)=>[i,avg(scores[t.id],keys)]).filter(p=>p[1]!==null);
    if(vals.length>1)add("polyline",{points:vals.map(([i,v])=>`${x(i)},${y(v)}`).join(" "),fill:"none",stroke:def.color,"stroke-width":2.5,"stroke-linejoin":"round"});
    vals.forEach(([i,v])=>add("circle",{cx:x(i),cy:y(v),r:4,fill:def.color}));
  }
  const keys=Object.entries(CONFIG.series).map(([name,def])=>el("span",{},el("i",{style:"background:"+def.color}),def.name+" ("+CONFIG.criteria.filter(c=>c.series===name).map(c=>c.name.toLowerCase()).join(", ")+")"));
  return el("div",{class:"chart"},el("h3",{},"Where the line is · "+(CONFIG.axis?.[round]||"Rung")),el("div",{class:"keys"},...keys),svg);
}
function row(t){
  const s=scores[t.id]||{};
  const put=patch=>{scores[t.id]={...scores[t.id],...patch,updatedAt:Date.now()};persist();render();};
  const note=el("textarea",{id:"note-"+t.id,placeholder:"Notes: what you heard",oninput:e=>{scores[t.id]={...scores[t.id],note:e.target.value,updatedAt:Date.now()};clearTimeout(noteTimer);noteTimer=setTimeout(persist,500);}});
  note.value=s.note||"";
  const ready=available.has(t.id);
  const verdict=s.verdict?" v-"+s.verdict:"";
  return el("div",{class:"row"+verdict+(ready?"":" pending")},
    el("div",{class:"player"},ready?player(t):el("span",{class:"wait"},"Rendering… this row fills in when the file appears.")),
    el("div",{class:"id"},el("div",{class:"rung"},t.label,el("small",{},t.sublabel||"")),el("div",{class:"file"},t.file)),
    el("div",{class:"crit"},...CRIT.map(([k,label])=>el("div",{},el("div",{class:"name"},label),
      el("div",{class:"dots",role:"group","aria-label":label},...[1,2,3,4,5].map(v=>el("button",{"aria-pressed":String(s[k]===v),"aria-label":`${label} ${v}`,onclick:()=>put({[k]:s[k]===v?null:v})},String(v))))))),
    el("div",{class:"foot"},
      el("div",{class:"verdict",role:"group","aria-label":"Verdict"},...[["good","Keep"],["borderline","Borderline"],["over","Over the line"]].map(([v,l])=>el("button",{"data-v":v,"aria-pressed":String(s.verdict===v),onclick:()=>put({verdict:s.verdict===v?null:v})},l))),
      note));
}
render();
</script>
</body>
</html>
