<!-- Ear-test score sheet template. Copy, set <title> and CONFIG below; everything else is generic.
     How to use: .claude/skills/ear-test-scoresheet/SKILL.md -->
<title>YuE2 Ladder Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F2F4F1; --surface:#FFFFFF; --sunk:#E7EBE6; --ink:#1A1F1C; --muted:#5E6862; --rule:#D3D9D3;
  --accent:#1F6F8B; --accent-ink:#FFFFFF; --good:#2E8A57; --warn:#B7801A; --bad:#B8402F;
  --good-bg:#E3F2E8; --warn-bg:#F7EDD6; --bad-bg:#F6E1DD;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--ground:#131715;--surface:#1B201D;--sunk:#232925;--ink:#E3E8E4;--muted:#95A09A;--rule:#2F3732;
  --accent:#58A9C6;--accent-ink:#0E1512;--good:#5BC08A;--warn:#E0AE4C;--bad:#E57A68;
  --good-bg:#1D3326;--warn-bg:#352C17;--bad-bg:#3A221E;}}
:root[data-theme="dark"]{
  color-scheme:dark;--ground:#131715;--surface:#1B201D;--sunk:#232925;--ink:#E3E8E4;--muted:#95A09A;--rule:#2F3732;
  --accent:#58A9C6;--accent-ink:#0E1512;--good:#5BC08A;--warn:#E0AE4C;--bad:#E57A68;
  --good-bg:#1D3326;--warn-bg:#352C17;--bad-bg:#3A221E;}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 64px}
header h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.01em;margin:0;text-wrap:balance}
header p{color:var(--muted);margin:6px 0 0;max-width:72ch}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px}
.status.err{color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 14px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:7px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 18px;margin:0 0 18px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.legend div{font-size:12.5px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;margin-bottom:14px}
.pick label{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.02em}
.pick select{font:500 14px var(--mono);padding:6px 8px;border-radius:6px;border:1px solid var(--rule);background:var(--ground);color:var(--ink)}
.pick textarea{flex:1 1 260px;min-height:36px}
.pick .count{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
.folder{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.folder code{background:var(--sunk);padding:4px 8px;border-radius:5px;color:var(--ink);word-break:break-all}
.ghost{border:1px solid var(--rule);background:transparent;color:var(--ink);font:500 12px var(--body);padding:4px 10px;border-radius:6px;cursor:pointer}
.chart{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px 6px;margin-bottom:14px}
.chart h3{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 4px;letter-spacing:.02em}
.chart .keys{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.chart .keys i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chart svg{width:100%;height:auto;display:block}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:170px 1fr;gap:14px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.row.v-good{border-left:4px solid var(--good)} .row.v-borderline{border-left:4px solid var(--warn)} .row.v-over{border-left:4px solid var(--bad)}
.id .rung{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05}
.id .rung small{display:block;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.id .file{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px;word-break:break-all}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.crit .name{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.dots{display:flex;gap:4px}
.dots button{width:30px;height:30px;border-radius:6px;border:1px solid var(--rule);background:var(--ground);color:var(--muted);font:500 13px var(--mono);cursor:pointer;font-variant-numeric:tabular-nums}
.dots button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.foot{grid-column:2;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.verdict{display:flex;gap:6px;flex-wrap:wrap}
.verdict button{border:1px solid var(--rule);background:transparent;color:var(--ink);font:600 12.5px var(--body);padding:6px 11px;border-radius:999px;cursor:pointer}
.verdict button[data-v="good"][aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.verdict button[data-v="borderline"][aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.verdict button[data-v="over"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
textarea{flex:1 1 280px;min-height:34px;resize:vertical;font:13px var(--body);padding:7px 9px;border-radius:6px;border:1px solid var(--rule);background:var(--ground);color:var(--ink)}
.player{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.player audio{width:100%;height:36px}
.player .wait{font:500 12.5px var(--mono);color:var(--muted);padding:8px 0}
.row.pending{opacity:.62}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--rule);border-radius:10px}
@media (max-width:720px){.row{grid-template-columns:1fr}.foot{grid-column:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p id="intro"></p>
    <div class="status" id="status" role="status">Connecting…</div>
  </header>

  <div class="bar">
    <div class="seg" id="roundSeg" role="group" aria-label="Round"></div>
    <div class="seg" id="artistSeg" role="group" aria-label="Artist"></div>
  </div>

  <div class="legend" id="legend"></div>

  <div id="panel"></div>
</div>

<script>
// ── CONFIG: the only part a new test edits (plus <title>). ──────────────────
// criteria: scored 1-5; `series` puts each into one of the two chart lines.
// Keep two series, one for "what we're pushing for" and one for "what breaks",
// so the chart shows where they cross. roundNames/axis are per round number.
const CONFIG={
  title:"YuE2 Ladder Scores",
  intro:"Play each render here, score it 1–5 on each criterion, mark it keep, borderline or over the line, then pick the last good rung for each artist. Everything saves as you go.",
  criteria:[
    {key:"voice",name:"Voice",desc:"the singer sounds like the artist",series:"likeness"},
    {key:"writing",name:"Songwriting",desc:"melodies, hooks and structure feel like theirs",series:"likeness"},
    {key:"sound",name:"Sound",desc:"guitar, drum and production tone match the album",series:"likeness"},
    {key:"diction",name:"Diction",desc:"every word intelligible, nothing garbled",series:"quality"},
    {key:"audio",name:"Audio",desc:"clean: no hiss, phasing, crackle or clipping",series:"quality"},
    {key:"coherence",name:"Coherence",desc:"holds together, no loops, ends properly",series:"quality"},
  ],
  series:{likeness:{name:"Likeness",color:"var(--accent)"},quality:{name:"Quality",color:"var(--warn)"}},
  roundNames:{1:"Round 1 · planner sweep",2:"Round 2 · decoder sweep"},
  axis:{1:"Planner step",2:"Decoder step"},
  pickLabel:"Last good rung",
};
// ─────────────────────────────────────────────────────────────────────────────
const CRIT=CONFIG.criteria.map(c=>[c.key,c.name]);
document.getElementById("title").textContent=CONFIG.title;
document.getElementById("intro").textContent=CONFIG.intro;
document.getElementById("legend").replaceChildren(...CONFIG.criteria.map(c=>{const d=document.createElement("div");const b=document.createElement("b");b.textContent=c.name;d.append(b," — "+c.desc);return d;}));
let db=null, tracks=[], scores={}, picks={}, round=null, artist=null;
// Track docs: {round, group, order, label, sublabel, x, reference, file, folder, url}.
// `group` is the tab (artist); `x` is the chart position; `reference` rows
// (e.g. a no-adapter render) are listed but kept off the chart and the picker.
// The fallbacks read the first calibration sheet's older fields.
const groupOf=t=>t.group??t.artist;
const isRef=t=>t.reference??(t.ar===0&&t.nar===0);
const xOf=t=>t.x??(t.sweep==="planner"?t.ar:t.nar);
const pending=new Map(), writing=new Set();
// One <audio> per track, reused across redraws so scoring never stops playback.
const players=new Map();
function player(t){
  let a=players.get(t.id);
  if(!a||a.dataset.src!==t.url){a=el("audio",{controls:"",preload:"metadata",src:t.url,"aria-label":"Play "+t.file});a.dataset.src=t.url;players.set(t.id,a);}
  return a;
}
document.addEventListener("play",e=>{for(const a of players.values())if(a!==e.target&&!a.paused)a.pause();},true);
const statusEl=document.getElementById("status");
function say(t,err){statusEl.textContent=t;statusEl.classList.toggle("err",!!err);}
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null)e.setAttribute(k,v);}for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e;}

// One write in flight per document; later edits coalesce into the next write.
function save(path,body){pending.set(path,body);flush(path);}
async function flush(path){
  if(writing.has(path)||!pending.has(path)||!db)return;
  const body=pending.get(path);pending.delete(path);writing.add(path);
  try{await db.doc(path).set(body);say("Saved "+new Date().toLocaleTimeString());}
  catch(e){say(e?.code==="invalid_argument"?"This view can't save scores (read-only access).":"Save failed: "+(e?.message||e?.code),true);}
  finally{writing.delete(path);if(pending.has(path))setTimeout(()=>flush(path),150);}
}
let noteTimers={};
function saveLater(path,body){clearTimeout(noteTimers[path]);noteTimers[path]=setTimeout(()=>save(path,body),600);}

function rungLabel(t){if(t.label)return[t.label,t.sublabel||""];return isRef(t)?["Base","no adapter"]:[t.sweep==="planner"?"Planner "+t.ar:"Decoder "+t.nar, t.sweep==="planner"?"decoder "+t.nar:"planner "+t.ar];}
function avg(s,keys){const v=keys.map(k=>s?.[k]).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}

function render(){
  const rounds=[...new Set(tracks.map(t=>t.round))].sort();
  if(round===null||!rounds.includes(round))round=rounds[rounds.length-1]??null;
  const artists=[...new Set(tracks.filter(t=>t.round===round).map(groupOf))];
  if(!artists.includes(artist))artist=artists[0]??null;
  const rs=document.getElementById("roundSeg");rs.replaceChildren(...rounds.map(r=>el("button",{"aria-pressed":String(r===round),onclick:()=>{round=r;render();}},CONFIG.roundNames[r]||"Round "+r)));
  const as=document.getElementById("artistSeg");as.replaceChildren(...artists.map(a=>el("button",{"aria-pressed":String(a===artist),onclick:()=>{artist=a;render();}},a)));
  const panel=document.getElementById("panel");
  const list=tracks.filter(t=>t.round===round&&groupOf(t)===artist).sort((a,b)=>a.order-b.order);
  if(!list.length){panel.replaceChildren(el("div",{class:"empty"},db?"No renders listed for this round yet.":"Scores need the saved-data connection; open this page on claude.ai."));return;}
  const pickPath=`picks/r${round}-${artist}`, pick=picks[`r${round}-${artist}`]||{};
  const scored=list.filter(t=>scores[t.id]?.verdict).length;
  const rungOpts=[el("option",{value:""},"— not decided —"),...list.filter(t=>!isRef(t)).map(t=>el("option",{value:t.id,...(pick.lastGood===t.id?{selected:""}:{})},rungLabel(t)[0]))];
  const sel=el("select",{id:"pick-"+round+"-"+artist,onchange:e=>{picks[`r${round}-${artist}`]={...pick,lastGood:e.target.value};save(pickPath,{...picks[`r${round}-${artist}`],round,artist,updatedAt:Date.now()});}},...rungOpts);
  const pnote=el("textarea",{id:"picknote-"+round+"-"+artist,placeholder:"Why this rung? What went wrong on the next one?",oninput:e=>{picks[`r${round}-${artist}`]={...picks[`r${round}-${artist}`],note:e.target.value};saveLater(pickPath,{...picks[`r${round}-${artist}`],round,artist,updatedAt:Date.now()});}});
  pnote.value=pick.note||"";
  const folder=list[0].folder;
  const copy=el("button",{class:"ghost",onclick:async e=>{try{await navigator.clipboard.writeText(folder);e.target.textContent="Copied";}catch{const r=document.createRange();r.selectNodeContents(e.target.previousSibling);getSelection().removeAllRanges();getSelection().addRange(r);}}},"Copy");
  panel.replaceChildren(
    el("div",{class:"folder"},"Files:",el("code",{},folder),copy),
    el("div",{class:"pick"},el("label",{for:sel.id},CONFIG.pickLabel),sel,pnote,el("span",{class:"count"},`${scored}/${list.length} judged`)),
    chart(list),
    el("div",{class:"rows"},...list.map(row))
  );
}

function chart(list){
  const pts=list.filter(t=>!isRef(t));
  const W=720,H=150,L=34,R=12,T=12,B=26;
  const x=i=>L+(pts.length<2?0:i*(W-L-R)/(pts.length-1)), y=v=>T+(5-v)*(H-T-B)/4;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("role","img");svg.setAttribute("aria-label","Likeness and quality by rung");
  const add=(tag,a)=>{const n=document.createElementNS(svg.namespaceURI,tag);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);svg.append(n);return n;};
  for(let v=1;v<=5;v++){add("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:"var(--rule)","stroke-width":1});const t=add("text",{x:L-8,y:y(v)+4,"text-anchor":"end","font-size":11,fill:"var(--muted)","font-family":"IBM Plex Mono, monospace"});t.textContent=v;}
  pts.forEach((t,i)=>{const n=add("text",{x:x(i),y:H-8,"text-anchor":"middle","font-size":11,fill:"var(--muted)","font-family":"IBM Plex Mono, monospace"});n.textContent=xOf(t);});
  for(const[name,def]of Object.entries(CONFIG.series)){
    const keys=CONFIG.criteria.filter(c=>c.series===name).map(c=>c.key);
    const vals=pts.map((t,i)=>[i,avg(scores[t.id],keys)]).filter(p=>p[1]!==null);
    if(vals.length>1)add("polyline",{points:vals.map(([i,v])=>`${x(i)},${y(v)}`).join(" "),fill:"none",stroke:def.color,"stroke-width":2.5,"stroke-linejoin":"round"});
    vals.forEach(([i,v])=>add("circle",{cx:x(i),cy:y(v),r:4,fill:def.color}));
  }
  const keys=Object.entries(CONFIG.series).map(([name,def])=>el("span",{},el("i",{style:"background:"+def.color}),
    def.name+" ("+CONFIG.criteria.filter(c=>c.series===name).map(c=>c.name.toLowerCase()).join(", ")+")"));
  return el("div",{class:"chart"},el("h3",{},"Where the line is · "+(CONFIG.axis[round]||"Rung")),el("div",{class:"keys"},...keys),svg);
}

function row(t){
  const s=scores[t.id]||{}, path="scores/"+t.id;
  const put=patch=>{scores[t.id]={...scores[t.id],...patch};save(path,{...scores[t.id],track:t.id,updatedAt:Date.now()});render();};
  const [big,small]=rungLabel(t);
  const note=el("textarea",{id:"note-"+t.id,placeholder:"Notes: what you heard",oninput:e=>{scores[t.id]={...scores[t.id],note:e.target.value};saveLater(path,{...scores[t.id],track:t.id,updatedAt:Date.now()});}});
  note.value=s.note||"";
  return el("div",{class:"row"+(s.verdict?" v-"+s.verdict:"")+(t.url?"":" pending")},
    el("div",{class:"player"},t.url?player(t):el("span",{class:"wait"},"Rendering… this row fills in when the audio is ready.")),
    el("div",{class:"id"},el("div",{class:"rung"},big,el("small",{},small)),el("div",{class:"file"},t.file)),
    el("div",{class:"crit"},...CRIT.map(([k,label])=>el("div",{},el("div",{class:"name"},label),
      el("div",{class:"dots",role:"group","aria-label":label},...[1,2,3,4,5].map(v=>el("button",{"aria-pressed":String(s[k]===v),"aria-label":`${label} ${v}`,onclick:()=>put({[k]:s[k]===v?null:v})},String(v))))))),
    el("div",{class:"foot"},
      el("div",{class:"verdict",role:"group","aria-label":"Verdict"},...[["good","Keep"],["borderline","Borderline"],["over","Over the line"]].map(([v,l])=>el("button",{"data-v":v,"aria-pressed":String(s.verdict===v),onclick:()=>put({verdict:s.verdict===v?null:v})},l))),
      note)
  );
}

render();
(async()=>{
  db=await window.claude?.use?.("db");
  if(!db){say("Saved data is unavailable in this view, so scores won't be kept.",true);render();return;}
  say("Connected");
  const err=e=>say("Lost the connection to saved data ("+e.code+"). Reload to reconnect.",true);
  db.collection("tracks").onSnapshot(s=>{tracks=s.docs.map(d=>({id:d.id,...d.data()}));render();},err);
  db.collection("scores").onSnapshot(s=>{
    const focus=document.activeElement?.id;
    for(const d of s.docs)if(!writing.has("scores/"+d.id)&&!pending.has("scores/"+d.id))scores[d.id]=d.data();
    if(!focus?.startsWith("note-"))render();
  },err);
  db.collection("picks").onSnapshot(s=>{
    const focus=document.activeElement?.id;
    for(const d of s.docs)picks[d.id]=d.data();
    if(!focus?.startsWith("picknote-"))render();
  },err);
})();
</script>
