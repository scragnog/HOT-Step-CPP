# ROCm/HIP compile-only guard.
#
# WHAT THIS IS FOR
#   The AMD ROCm backend (PR #115) is community-contributed and nothing else in
#   CI builds it, so it would rot silently — the next person to touch
#   engine/src/gpu.h, the GGML_HIP gate in engine/CMakeLists.txt, or any file
#   that includes <cuda_runtime.h> would break it with no signal. This job is
#   that signal.
#
# WHAT THIS IS NOT
#   - Not a release job. It produces no artifacts and packages nothing.
#     ROCm builds are not shipped; users build them with engine/buildhip.sh.
#   - Not a functional test. GitHub-hosted runners have no AMD GPU, so this
#     only proves the code COMPILES and LINKS under HIP. It cannot catch a
#     wrong hipMemGetInfo result, only a wrong hipMemGetInfo signature.
#   - Not a packaging job. It produces no artifacts. ROCm builds are not
#     shipped; users build them with engine/buildhip.sh.
#
# BUILD PARITY
#   Configured like build-linux in release.yml — ONNX Runtime present, backend
#   DL on, all CPU variants, every target built. It used to build only
#   `ace-server` with no ORT, which left most of the engine untested under HIP:
#   ace-caption broke the ordinary Linux build for twelve days in 2026-08 and
#   this job could not have caught it, because it never compiled that target.
#
#   One deliberate difference remains: GPU_TARGET is a single arch. HIP
#   recompiles the whole ggml-cuda kernel set per target, so each extra arch is
#   roughly another full kernel build.
#
# NON-BLOCKING FOR NOW
#   continue-on-error: true, which is why a red job still shows the run as
#   green. That masked a broken ROCm apt install for weeks. The intent is to
#   make this blocking once it has been green for a while; until then, read it
#   as advisory and CHECK THE JOB, not the run.

name: ROCm Build (compile-only)

on:
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/rocm-build.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/rocm-build.yml'
  workflow_dispatch:

concurrency:
  group: rocm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rocm:
    name: Compile engine under ROCm/HIP
    runs-on: ubuntu-22.04   # jammy — matches build-linux in release.yml, and is
                            # a supported target for the ROCm apt repo below.
    continue-on-error: true
    timeout-minutes: 120

    env:
      # 6.4.4, not 6.2.4. ggml's vendors/hip.h guards its fp8 typedef on
      # HIP_VERSION >= 60200000 and then uses __hip_fp8_e4m3 — but ROCm 6.2
      # ships only the FNUZ spelling, __hip_fp8_e4m3_fnuz. The OCP type arrived
      # in 6.3, so on 6.2.4 every ggml-cuda TU fails with "unknown type name
      # '__hip_fp8_e4m3'". Upstream's guard is a minor version too low; bumping
      # is cheaper than carrying a patch for it.
      ROCM_VERSION: '6.4.4'
      # Matches release.yml so the ORT paths (sa3-refine, the ORT VAE/encoders)
      # actually get compiled here.
      ORT_VERSION: '1.25.1'
      # Single GPU arch. HIP recompiles the whole ggml-cuda kernel set per
      # target, so each extra arch is roughly another full kernel build. gfx1030
      # (RDNA2) is the same default engine/buildhip.sh falls back to.
      GPU_TARGET: 'gfx1030'

    steps:
      # ROCm is multi-GB and the HIP objects are large; the stock runner image
      # does not leave enough headroom.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "After:"; df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # Manual init below — vstgui4 is fragile + unneeded.

      # Mirrors release.yml's build-linux. vst3sdk is NOT optional: engine's
      # CMakeLists references its sources unconditionally, so configure fails
      # without it even though this job never builds vst-host.
      - name: Init required submodules
        run: |
          git submodule update --init engine/ggml
          git submodule update --init engine/vendor/vst3sdk
          cd engine/vendor/vst3sdk
          git submodule update --init base cmake pluginterfaces public.sdk

      # Same step as release.yml. This used to be survivable to skip — every
      # patch was optional behaviour — but flash-attn-train.patch adds ggml
      # symbols the trainer source now REFERENCES, so an unpatched submodule
      # no longer compiles at all.
      - name: Apply engine patches
        run: |
          for p in engine/patches/*.patch; do
            echo "== $p"
            git apply --stat    "$p"
            git apply --verbose "$p"
          done

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      # rocm-hip-sdk, not the full `rocm` metapackage: it pulls hip + rocblas +
      # hipblas (everything ggml/src/ggml-hip/CMakeLists.txt find_package()s)
      # without the profilers, libraries and tooling we would never compile
      # against. --no-dkms equivalent: we install no kernel driver, because
      # nothing here talks to a GPU.
      - name: Install ROCm ${{ env.ROCM_VERSION }}
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${ROCM_VERSION} jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          # Ubuntu jammy carries its own rocminfo/rocm-cmake/rocm-device-libs at
          # 5.0.0-1, and both repos sit at the default priority 500, so apt is
          # free to satisfy rocm-hip-sdk's dependencies from the Ubuntu archive.
          # It does, then finds the versions cannot possibly agree:
          #   rocm-hip-runtime : Depends: rocminfo (= 1.0.0.60204-139~22.04)
          #                      but 5.0.0-1 is to be installed
          #   E: Unable to correct problems, you have held broken packages
          # Raising repo.radeon.com above 500 makes every ROCm package resolve
          # from the one repo that ships a matching set. This pin is AMD's own
          # documented install step; Origin is verified against the InRelease
          # file at https://repo.radeon.com/rocm/apt/<ver>/dists/jammy/InRelease.
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y rocm-hip-sdk
          # Prove the pin took: a mixed 5.0.0-1/6.x install is the failure this
          # guards against, and it is invisible until the HIP build breaks oddly.
          apt-cache policy rocminfo rocm-cmake rocm-device-libs
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"

      - name: Verify ROCm toolchain
        run: |
          /opt/rocm/bin/hipconfig --version
          /opt/rocm/llvm/bin/clang++ --version
          df -h /

      # ── ONNX Runtime ───────────────────────────────────────────
      # Same package and version release.yml's build-linux uses. CMake
      # auto-detects it at engine/deps/onnxruntime, which turns on
      # HOT_STEP_ORT_PATHS — sa3-refine.h and the ORT VAE/encoder paths.
      - name: Cache ONNX Runtime
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: engine/deps/onnxruntime
          key: ort-linux-x64-gpu-${{ env.ORT_VERSION }}

      - name: Download ONNX Runtime
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          ORT_URL="https://github.com/microsoft/onnxruntime/releases/download/v${{ env.ORT_VERSION }}/onnxruntime-linux-x64-gpu-${{ env.ORT_VERSION }}.tgz"
          mkdir -p engine/deps
          curl -sL "$ORT_URL" | tar -xz -C engine/deps
          mv "engine/deps/onnxruntime-linux-x64-gpu-${{ env.ORT_VERSION }}" engine/deps/onnxruntime

      # HIPCXX/HIP_PATH is the invocation ggml documents for HIP builds; without
      # it CMake's enable_language(HIP) may not find the ROCm clang.
      # GGML_STATIC must stay OFF — ggml-hip raises a hard FATAL_ERROR on it.
      - name: Configure
        run: |
          set -o pipefail
          HIPCXX="$(/opt/rocm/bin/hipconfig -l)/clang" \
          HIP_PATH="$(/opt/rocm/bin/hipconfig -R)" \
          cmake -S engine -B engine/build \
            -DGGML_HIP=ON \
            -DGPU_TARGETS="${GPU_TARGET}" \
            -DGGML_STATIC=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      # Confirms the GGML_HIP gate in engine/CMakeLists.txt actually fired. The
      # marker is a message(STATUS ...), so it lives in the configure output,
      # not in CMakeCache.txt. If this fails, the ROCm block was skipped and the
      # build below would silently be a non-HIP build.
      - name: Assert the ROCm gate engaged
        run: |
          grep -q "GGML_HIP:BOOL=ON" engine/build/CMakeCache.txt \
            || { echo "::error::GGML_HIP did not stick in the CMake cache"; exit 1; }
          grep -q "building with AMD ROCm support" configure.log \
            || { echo "::error::ROCm gate did not fire — find_package(hip) failed inside the GGML_HIP block"; exit 1; }
          echo "GGML_HIP=ON and the ROCm gate fired"

      - name: Assert the ONNX Runtime paths compiled
        run: |
          grep -q "ONNX Runtime paths: ENABLED" configure.log \
            || { echo "::error::ORT paths did not compile — sa3-refine and the ORT VAE/encoders went untested"; exit 1; }
          echo "HOT_STEP_ORT_PATHS is on"

      # Every target, as release.yml's build-linux does. The tools are cheap
      # next to the HIP kernels, which are already built by the time they start.
      - name: Build engine
        run: cmake --build engine/build -j "$(nproc)"

      # CMAKE_RUNTIME_OUTPUT_DIRECTORY is the build root (engine/CMakeLists.txt:48),
      # so a single-config Linux build drops the binaries at engine/build/<name>.
      - name: Confirm binaries
        run: |
          missing=0
          for b in ace-server ace-lm ace-synth ace-understand ace-train ace-caption \
                   ace-midi quantize neural-codec mp3-codec mastering; do
            if [ -f "engine/build/$b" ]; then
              printf '  ok      %s\n' "$b"
            else
              printf '  MISSING %s\n' "$b"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || { echo "::error::one or more engine binaries missing after build"; exit 1; }
          file engine/build/ace-server
          # Proves the HIP backend is actually in the build, not silently absent.
          ls -la engine/build/libggml-hip.so \
            || { echo "::error::libggml-hip.so not produced — the build fell back to a non-HIP backend"; exit 1; }
